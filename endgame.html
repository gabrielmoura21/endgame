<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: barra fixa no topo (nome, busca, adicionar), resumo em linha, filtros em chips e uma grade de capas 2:3. Cadastro e edição abrem num painel modal. */
:root {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #20242e;
  --fg: #eceef4;
  --muted: #8d93a3;
  --line: #262a35;
  --accent: #8b9bff;
  --accent-fg: #0f1220;
  --danger: #ff8a80;
  --overlay: rgba(5, 7, 10, 0.72);
  --font-display: "Sora", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --fg: #14161c;
    --muted: #5f6575;
    --line: #dfe2ea;
    --accent: #3a4de0;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --overlay: rgba(20, 22, 28, 0.5);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --fg: #14161c;
  --muted: #5f6575;
  --line: #dfe2ea;
  --accent: #3a4de0;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --overlay: rgba(20, 22, 28, 0.5);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
.inner {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; margin: 0; margin-right: auto; }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input {
  width: 100%; min-height: 40px; padding: 0 14px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}
.search input::placeholder { color: var(--muted); }
.btn { min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.9rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); border-color: var(--danger); color: var(--bg); }
.btn:disabled { opacity: 0.55; cursor: default; }

/* resumo + filtros */
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; padding-block: 20px 6px; color: var(--muted); font-size: 0.9rem; }
.summary b { color: var(--fg); font-weight: 700; font-size: 1.15rem; margin-right: 5px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; align-items: center; gap: 12px; padding-block: 12px 18px; }
.chips { display: flex; gap: 8px; overflow-x: auto; flex: 1; min-width: 0; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; }
.chip:hover { color: var(--fg); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.sort { flex: none; min-height: 34px; padding: 0 10px; font: inherit; font-size: 0.85rem; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }

/* grade */
.grid { list-style: none; margin: 0; padding: 0 0 56px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
.game { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; min-width: 0; }
.game:disabled { cursor: default; }
.cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: 0 0 0 1px var(--line); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.game:not(:disabled):hover .cover, .game:focus-visible .cover { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--accent); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; color: #f1f2f7; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; line-height: 1.25; overflow-wrap: anywhere; }
.badge { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(10, 12, 16, 0.82); font-weight: 700; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.badge.low { color: #aeb3c2; }
.badge.mid { color: #a9b4ff; }
.badge.high { color: #ffd166; }
.tag-ex { position: absolute; right: 8px; top: 8px; padding: 1px 7px; border-radius: 6px; background: rgba(10, 12, 16, 0.7); color: #c9ccd8; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.g-title { margin: 9px 0 0; font-weight: 600; font-size: 0.92rem; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.g-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 56px 16px; border: 1px dashed var(--line); border-radius: 10px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 40px; color: var(--muted); font-size: 0.8rem; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.8rem; }

/* modal */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 640px; margin: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.modal h2 { margin: 0 0 18px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.m-body { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; }
.cover-pick { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drop { position: relative; aspect-ratio: 2 / 3; border-radius: 8px; border: 1px dashed var(--muted); background: var(--surface-2); overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; color: var(--muted); font-size: 0.8rem; cursor: pointer; width: 100%; }
.drop.over { border-color: var(--accent); color: var(--fg); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pick-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pick-actions .btn { min-height: 34px; padding: 0 12px; font-size: 0.8rem; flex: 1; }
.fields { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field select {
  width: 100%; min-width: 0; min-height: 44px; padding: 0 12px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.rating-row { display: flex; align-items: center; gap: 14px; min-height: 44px; }
.rating-row input { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.rating-value { min-width: 3.2ch; text-align: right; font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.m-foot { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.m-foot .spacer { flex: 1; }
.status { color: var(--muted); font-size: 0.85rem; min-height: 1.3em; margin-top: 12px; }
.status.error { color: var(--danger); }

@media (max-width: 600px) {
  .m-body { grid-template-columns: 1fr; }
  .cover-pick { max-width: 190px; margin: 0 auto; width: 100%; }
  .search { flex: 1 1 100%; order: 3; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; }
  .toolbar { flex-wrap: wrap; }
  .modal { padding: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

<header class="topbar">
  <div class="inner">
    <h1 class="brand">Zerados</h1>
    <div class="search"><input type="search" id="q" placeholder="Buscar na sua lista" aria-label="Buscar na sua lista"></div>
    <button type="button" class="btn primary" id="add-btn">Adicionar jogo</button>
  </div>
</header>

<main class="inner">
  <div class="summary" id="summary" aria-label="Resumo">
    <span><b id="stat-total">0</b>zerados</span>
    <span><b id="stat-avg">–</b>nota média</span>
    <span><b id="stat-year">0</b><span id="stat-year-cap">neste ano</span></span>
  </div>
  <div class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="Filtrar por plataforma"></div>
    <select class="sort" id="sort" aria-label="Ordenar">
      <option value="date-desc">Mais recentes</option>
      <option value="date-asc">Mais antigos</option>
      <option value="rating-desc">Maior nota</option>
      <option value="rating-asc">Menor nota</option>
      <option value="title-asc">A–Z</option>
    </select>
  </div>
  <ul class="grid" id="grid"></ul>
  <div class="foot">
    <span id="storage-note"></span>
    <button type="button" class="link-btn" id="clear-examples" hidden>Remover jogos de exemplo</button>
  </div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title">Adicionar jogo</h2>
    <form id="game-form" autocomplete="off">
      <div class="m-body">
        <div class="cover-pick">
          <div class="drop" id="drop" tabindex="0" role="button" aria-label="Escolher imagem de capa">
            <span id="drop-hint">Solte uma imagem aqui, cole com Ctrl+V ou toque para escolher</span>
            <img id="cover-prev" alt="Prévia da capa" hidden>
          </div>
          <div class="pick-actions">
            <button type="button" class="btn" id="pick-btn">Escolher capa</button>
            <button type="button" class="btn" id="rm-cover" hidden>Remover</button>
          </div>
          <input type="file" id="file" accept="image/*" hidden>
        </div>
        <div class="fields">
          <div class="field">
            <label for="title">Jogo</label>
            <input type="text" id="title" list="game-suggestions" placeholder="Digite ou escolha da lista" maxlength="120" required>
            <datalist id="game-suggestions"></datalist>
          </div>
          <div class="field">
            <label for="date">Data em que zerou</label>
            <input type="date" id="date" required>
          </div>
          <div class="field">
            <label for="platform">Plataforma</label>
            <select id="platform" required></select>
          </div>
          <div class="field">
            <span class="lbl" id="rating-label">Nota</span>
            <div class="rating-row">
              <input type="range" id="rating" min="0" max="10" step="0.5" value="8" aria-labelledby="rating-label">
              <output id="rating-out" class="rating-value" for="rating">8,0</output>
            </div>
          </div>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="m-foot">
        <button type="button" class="btn danger" id="del-btn" hidden>Excluir</button>
        <span class="spacer"></span>
        <button type="button" class="btn" id="cancel-btn">Cancelar</button>
        <button type="submit" class="btn primary" id="save-btn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  var SUGGESTIONS = ["Elden Ring","The Legend of Zelda: Breath of the Wild","The Legend of Zelda: Tears of the Kingdom","The Witcher 3: Wild Hunt","Red Dead Redemption 2","God of War","God of War Ragnarök","The Last of Us Part I","The Last of Us Part II","Hollow Knight","Celeste","Hades","Stardew Valley","Cyberpunk 2077","Baldur's Gate 3","Dark Souls","Dark Souls III","Sekiro: Shadows Die Twice","Bloodborne","Hogwarts Legacy","Horizon Zero Dawn","Horizon Forbidden West","Marvel's Spider-Man","Marvel's Spider-Man 2","Ghost of Tsushima","Resident Evil 4","Resident Evil 2","Resident Evil Village","Persona 5 Royal","Final Fantasy VII Remake","Final Fantasy X","Super Mario Odyssey","Super Mario Bros. Wonder","Metroid Dread","Hollow Knight: Silksong","Disco Elysium","Undertale","Portal 2","Half-Life 2","Half-Life: Alyx","Mass Effect Legendary Edition","Grand Theft Auto V","Grand Theft Auto: San Andreas","Fallout 4","Fallout: New Vegas","The Elder Scrolls V: Skyrim","DOOM Eternal","DOOM (2016)","Control","Alan Wake 2","Death Stranding","Metal Gear Solid V: The Phantom Pain","Uncharted 4: A Thief's End","Assassin's Creed Odyssey","Assassin's Creed Valhalla","Assassin's Creed II","Batman: Arkham City","Sea of Thieves","Cuphead","Ori and the Will of the Wisps","Little Nightmares II","Inside","Limbo","It Takes Two","A Plague Tale: Requiem","Star Wars Jedi: Survivor","Pokémon Legends: Arceus","Kirby and the Forgotten Land","Xenoblade Chronicles 3","Fire Emblem: Three Houses","Animal Crossing: New Horizons","Forza Horizon 5","F1 24","EA Sports FC 25","Clair Obscur: Expedition 33"];
  var PLATFORMS = ["PC","PlayStation 5","PlayStation 4","PlayStation 3","PlayStation 2","Xbox Series X|S","Xbox One","Xbox 360","Nintendo Switch","Wii U","Nintendo 3DS","Steam Deck","Celular","Retrô / Emulador","Outra"];
  var LS_KEY = "zerados:games:v1";

  var $ = function (id) { return document.getElementById(id); };
  var games = [];
  var editingId = null;
  var coverData = "";      // data URI da capa no formulário ("" = sem capa)
  var backend = null;
  var canWrite = true;
  var ready = false;
  var platFilter = "";
  var lastFocus = null;
  var armed = false, armedTimer = null;

  // ---------- helpers ----------
  function fmtRating(n) { return Number(n).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
  function fmtDate(iso) {
    var d = new Date(iso + "T12:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" }).replace(".", "");
  }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function scoreClass(r) { return r >= 8 ? "high" : r >= 5 ? "mid" : "low"; }
  function newId() {
    try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return "g" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function hueOf(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
  function setStatus(msg, isError) { var el = $("status"); el.textContent = msg || ""; el.className = "status" + (isError ? " error" : ""); }
  function errMsg(e) {
    var c = e && e.code;
    if (c === "quota_exceeded") return "O limite de registros foi atingido.";
    if (c === "invalid_argument") return "Sem permissão para alterar esta lista, ou a imagem é grande demais.";
    if (c === "revoked") return "O acesso a esta página mudou. Recarregue.";
    return "Não foi possível salvar agora. Tente de novo.";
  }

  // ---------- capa: redimensiona para 2:3 e comprime ----------
  function processImage(file) {
    return new Promise(function (resolve, reject) {
      if (!file || !/^image\//.test(file.type)) { reject(new Error("Escolha um arquivo de imagem.")); return; }
      if (file.size > 15 * 1024 * 1024) { reject(new Error("A imagem passa de 15 MB.")); return; }
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error("Não foi possível ler a imagem.")); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("Formato de imagem não suportado.")); };
        img.onload = function () {
          var W = 400, H = 600;
          var c = document.createElement("canvas"); c.width = W; c.height = H;
          var ctx = c.getContext("2d");
          var s = Math.max(W / img.width, H / img.height);
          var w = img.width * s, h = img.height * s;
          ctx.fillStyle = "#14161c"; ctx.fillRect(0, 0, W, H);
          ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
          var q = 0.86, out = c.toDataURL("image/jpeg", q);
          while (out.length > 170000 && q > 0.4) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
          resolve(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }
  function applyCover(file) {
    setStatus("Processando imagem…");
    processImage(file).then(function (d) { coverData = d; showCover(); setStatus(""); },
      function (e) { setStatus(e.message || "Não foi possível usar essa imagem.", true); });
  }
  function showCover() {
    var img = $("cover-prev");
    if (coverData) { img.src = coverData; img.hidden = false; $("drop-hint").hidden = true; $("rm-cover").hidden = false; $("pick-btn").textContent = "Trocar capa"; }
    else { img.removeAttribute("src"); img.hidden = true; $("drop-hint").hidden = false; $("rm-cover").hidden = true; $("pick-btn").textContent = "Escolher capa"; }
  }
  $("pick-btn").addEventListener("click", function () { $("file").click(); });
  $("drop").addEventListener("click", function () { $("file").click(); });
  $("drop").addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  $("file").addEventListener("change", function () { var f = this.files && this.files[0]; this.value = ""; if (f) applyCover(f); });
  $("rm-cover").addEventListener("click", function () { coverData = ""; showCover(); });
  ["dragenter", "dragover"].forEach(function (t) { $("drop").addEventListener(t, function (e) { e.preventDefault(); $("drop").classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (t) { $("drop").addEventListener(t, function (e) { e.preventDefault(); $("drop").classList.remove("over"); }); });
  $("drop").addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) applyCover(f); });
  document.addEventListener("paste", function (e) {
    if ($("overlay").hidden) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file" && /^image\//.test(items[i].type)) { var f = items[i].getAsFile(); if (f) { e.preventDefault(); applyCover(f); } return; }
    }
  });

  // ---------- formulário / modal ----------
  var dl = $("game-suggestions");
  SUGGESTIONS.forEach(function (s) { var o = document.createElement("option"); o.value = s; dl.appendChild(o); });
  var pSel = $("platform");
  PLATFORMS.forEach(function (p) { var o = document.createElement("option"); o.value = p; o.textContent = p; pSel.appendChild(o); });
  $("date").max = todayISO();
  var ratingEl = $("rating");
  function syncRating() { $("rating-out").textContent = fmtRating(ratingEl.value); }
  ratingEl.addEventListener("input", syncRating);

  function resetArm() { armed = false; clearTimeout(armedTimer); var b = $("del-btn"); b.textContent = "Excluir"; b.classList.remove("armed"); }

  function openModal(g) {
    lastFocus = document.activeElement;
    editingId = g ? g.id : null;
    coverData = g && g.cover ? g.cover : "";
    $("m-title").textContent = g ? "Editar jogo" : "Adicionar jogo";
    $("title").value = g ? g.title : "";
    $("date").value = g ? g.date : todayISO();
    if (g && PLATFORMS.indexOf(g.platform) < 0) { var o = document.createElement("option"); o.value = o.textContent = g.platform; pSel.appendChild(o); }
    pSel.value = g ? g.platform : PLATFORMS[0];
    ratingEl.value = g ? g.rating : 8; syncRating();
    $("del-btn").hidden = !g;
    resetArm(); showCover(); setStatus("");
    $("overlay").hidden = false;
    document.body.style.overflow = "hidden";
    $("title").focus();
  }
  function closeModal() {
    $("overlay").hidden = true;
    document.body.style.overflow = "";
    resetArm();
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus(); } catch (e) {} }
  }
  $("add-btn").addEventListener("click", function () { openModal(null); });
  $("cancel-btn").addEventListener("click", closeModal);
  $("overlay").addEventListener("mousedown", function (e) { if (e.target === $("overlay")) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("overlay").hidden) closeModal(); });

  $("game-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!ready || !backend) { setStatus("Aguarde, a lista ainda está carregando.", true); return; }
    var title = $("title").value.trim();
    if (!title) { setStatus("Informe o nome do jogo.", true); return; }
    var existing = editingId ? games.filter(function (g) { return g.id === editingId; })[0] : null;
    var data = { title: title, platform: pSel.value, date: $("date").value, rating: Number(ratingEl.value), createdAt: existing ? existing.createdAt : Date.now() };
    if (coverData) data.cover = coverData;
    var id = editingId || newId();
    var btn = $("save-btn"); btn.disabled = true;
    Promise.resolve(backend.save(id, data)).then(function () { closeModal(); },
      function (e) { setStatus(errMsg(e), true); }).then(function () { btn.disabled = false; });
  });
  $("del-btn").addEventListener("click", function () {
    var b = $("del-btn");
    if (!armed) { armed = true; b.textContent = "Confirmar exclusão"; b.classList.add("armed"); armedTimer = setTimeout(resetArm, 3500); return; }
    var id = editingId;
    if (!id) return;
    b.disabled = true;
    Promise.resolve(backend.remove(id)).then(function () { closeModal(); },
      function (e) { setStatus(errMsg(e), true); }).then(function () { b.disabled = false; });
  });

  // ---------- lista ----------
  function visibleGames() {
    var q = $("q").value.trim().toLowerCase();
    var list = games.filter(function (g) { return (!platFilter || g.platform === platFilter) && (!q || g.title.toLowerCase().indexOf(q) >= 0); });
    var sort = $("sort").value;
    list.sort(function (a, b) {
      switch (sort) {
        case "date-asc": return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
        case "rating-desc": return b.rating - a.rating || (a.date < b.date ? 1 : -1);
        case "rating-asc": return a.rating - b.rating || (a.date < b.date ? 1 : -1);
        case "title-asc": return a.title.localeCompare(b.title, "pt-BR");
        default: return a.date < b.date ? 1 : a.date > b.date ? -1 : 0;
      }
    });
    return list;
  }
  function renderStats() {
    var total = games.length;
    $("stat-total").textContent = total;
    $("stat-avg").textContent = total ? fmtRating(games.reduce(function (s, g) { return s + g.rating; }, 0) / total) : "–";
    var y = new Date().getFullYear();
    $("stat-year-cap").textContent = "em " + y;
    $("stat-year").textContent = games.filter(function (g) { return g.date.slice(0, 4) === String(y); }).length;
  }
  function renderChips() {
    var box = $("chips"); box.innerHTML = "";
    var used = {}; games.forEach(function (g) { used[g.platform] = (used[g.platform] || 0) + 1; });
    if (platFilter && !used[platFilter]) platFilter = "";
    function chip(label, val) {
      var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = label;
      b.setAttribute("aria-pressed", String(platFilter === val));
      b.addEventListener("click", function () { platFilter = val; renderChips(); renderGrid(); });
      box.appendChild(b);
    }
    chip("Todos", "");
    PLATFORMS.concat(Object.keys(used).filter(function (p) { return PLATFORMS.indexOf(p) < 0; })).forEach(function (p) { if (used[p]) chip(p, p); });
  }
  function renderGrid() {
    var ul = $("grid"); ul.innerHTML = "";
    function empty(title, text, withBtn) {
      var li = document.createElement("li"); li.className = "empty";
      var s = document.createElement("strong"); s.textContent = title; li.appendChild(s);
      li.appendChild(document.createTextNode(text));
      if (withBtn) { var b = document.createElement("button"); b.type = "button"; b.className = "btn primary"; b.textContent = "Adicionar jogo"; b.addEventListener("click", function () { openModal(null); }); li.appendChild(document.createElement("br")); li.appendChild(b); }
      ul.appendChild(li);
    }
    if (!ready) { empty("Carregando sua lista", "Só um instante.", false); return; }
    if (!games.length) { empty("Nenhum jogo zerado ainda", canWrite ? "Registre o primeiro e coloque a capa que quiser." : "Quem mantém esta lista ainda não registrou nada.", canWrite); return; }
    var list = visibleGames();
    if (!list.length) { empty("Nada encontrado", "Nenhum jogo corresponde à busca ou ao filtro.", false); return; }
    list.forEach(function (g) {
      var li = document.createElement("li");
      var b = document.createElement("button"); b.type = "button"; b.className = "game"; b.disabled = !canWrite;
      b.setAttribute("aria-label", g.title + ", nota " + fmtRating(g.rating) + ", " + g.platform);
      var cv = document.createElement("div"); cv.className = "cover";
      if (g.cover) { var im = document.createElement("img"); im.src = g.cover; im.alt = ""; im.loading = "lazy"; cv.appendChild(im); }
      else {
        var h = hueOf(g.title);
        cv.style.background = "linear-gradient(160deg, hsl(" + h + " 36% 32%), hsl(" + ((h + 40) % 360) + " 40% 17%))";
        var ph = document.createElement("div"); ph.className = "ph"; ph.textContent = g.title; cv.appendChild(ph);
      }
      var bd = document.createElement("span"); bd.className = "badge " + scoreClass(g.rating); bd.textContent = fmtRating(g.rating); cv.appendChild(bd);
      if (g.example) { var ex = document.createElement("span"); ex.className = "tag-ex"; ex.textContent = "exemplo"; cv.appendChild(ex); }
      var t = document.createElement("p"); t.className = "g-title"; t.textContent = g.title;
      var m = document.createElement("p"); m.className = "g-meta"; m.textContent = g.platform + " · " + fmtDate(g.date);
      b.appendChild(cv); b.appendChild(t); b.appendChild(m);
      if (canWrite) b.addEventListener("click", function () { openModal(g); });
      li.appendChild(b); ul.appendChild(li);
    });
  }
  function renderAll() {
    renderStats(); renderChips(); renderGrid();
    $("clear-examples").hidden = !(canWrite && games.some(function (g) { return g.example; }));
    $("add-btn").hidden = !canWrite;
  }
  $("q").addEventListener("input", renderGrid);
  $("sort").addEventListener("change", renderGrid);
  $("clear-examples").addEventListener("click", function () {
    var ex = games.filter(function (g) { return g.example; });
    Promise.all(ex.map(function (g) { return backend.remove(g.id); })).catch(function () {});
  });

  // ---------- armazenamento ----------
  function normalize(id, d) {
    return {
      id: id, title: String(d.title || ""), platform: String(d.platform || "Outra"),
      date: /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : todayISO(),
      rating: Math.min(10, Math.max(0, Number(d.rating) || 0)),
      createdAt: Number(d.createdAt) || 0, example: d.example === true,
      cover: typeof d.cover === "string" && d.cover.indexOf("data:image/") === 0 ? d.cover : ""
    };
  }
  function useLocal() {
    var raw = [];
    try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) {}
    games = (Array.isArray(raw) ? raw : []).map(function (d) { return normalize(d.id, d); });
    function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(games)); } catch (e) {} }
    backend = {
      save: function (id, data) {
        var item = normalize(id, data);
        var i = games.findIndex(function (g) { return g.id === id; });
        if (i >= 0) games[i] = item; else games.push(item);
        persist(); renderAll();
      },
      remove: function (id) { games = games.filter(function (g) { return g.id !== id; }); persist(); renderAll(); }
    };
    $("storage-note").textContent = "Salvo apenas neste navegador.";
    ready = true; renderAll();
  }
  function useDb(db) {
    var col = db.collection("games");
    var timer = setTimeout(function () {
      if (!ready) { ready = true; $("storage-note").textContent = "Não foi possível alcançar a lista salva. Tente de novo em instantes."; renderAll(); }
    }, 10000);
    backend = {
      save: function (id, data) { return col.doc(id).set(data); },
      remove: function (id) { return col.doc(id).delete(); }
    };
    col.onSnapshot(function (snap) {
      games = snap.docs.map(function (d) { return normalize(d.id, d.data() || {}); });
      if (!snap.metadata.fromCache) { clearTimeout(timer); $("storage-note").textContent = "Lista salva na sua conta."; }
      ready = true; renderAll();
    }, function (e) {
      clearTimeout(timer); ready = true;
      $("storage-note").textContent = e && e.code === "revoked" ? "O acesso mudou. Recarregue a página." : "Erro ao carregar a lista.";
      renderAll();
    });
  }
  function boot() {
    renderAll();
    var c = window.claude;
    if (!c || !c.use) { useLocal(); return; }
    Promise.all([c.use("db"), c.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) { useLocal(); return; }
      return Promise.resolve(user ? user.canEdit() : true).then(function (ce) { canWrite = ce !== false; useDb(db); });
    }).catch(function () { useLocal(); });
  }
  boot();
})();
</script>

</body></html>
