<style>
/* Layout: barra fixa no topo (nome, busca, adicionar), resumo em linha, filtros em chips e uma grade de capas 2:3. Cadastro e edição abrem num painel modal. */
:root {
  --glass: rgba(24, 27, 36, 0.55);
  --glass-strong: rgba(20, 23, 31, 0.88);
  --glass-line: rgba(255, 255, 255, 0.09);
  --glow: rgba(139, 155, 255, 0.45);
  --glow-soft: rgba(139, 155, 255, 0.16);
  --bg-glow-1: rgba(98, 112, 255, 0.2);
  --bg-glow-2: rgba(168, 85, 247, 0.12);
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #20242e;
  --fg: #eceef4;
  --muted: #8d93a3;
  --line: #262a35;
  --accent: #8b9bff;
  --accent-fg: #0f1220;
  --danger: #ff8a80;
  --overlay: rgba(5, 7, 10, 0.72);
  --font-display: "Sora", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --glass: rgba(255, 255, 255, 0.66);
    --glass-strong: rgba(255, 255, 255, 0.92);
    --glass-line: rgba(20, 22, 28, 0.1);
    --glow: rgba(58, 77, 224, 0.35);
    --glow-soft: rgba(58, 77, 224, 0.12);
    --bg-glow-1: rgba(98, 112, 255, 0.16);
    --bg-glow-2: rgba(168, 85, 247, 0.1);
    --bg: #f4f5f8;
    --surface: #ffffff;
    --surface-2: #eceef3;
    --fg: #14161c;
    --muted: #5f6575;
    --line: #dfe2ea;
    --accent: #3a4de0;
    --accent-fg: #ffffff;
    --danger: #b3261e;
    --overlay: rgba(20, 22, 28, 0.5);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --glass: rgba(255, 255, 255, 0.66);
  --glass-strong: rgba(255, 255, 255, 0.92);
  --glass-line: rgba(20, 22, 28, 0.1);
  --glow: rgba(58, 77, 224, 0.35);
  --glow-soft: rgba(58, 77, 224, 0.12);
  --bg-glow-1: rgba(98, 112, 255, 0.16);
  --bg-glow-2: rgba(168, 85, 247, 0.1);
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-2: #eceef3;
  --fg: #14161c;
  --muted: #5f6575;
  --line: #dfe2ea;
  --accent: #3a4de0;
  --accent-fg: #ffffff;
  --danger: #b3261e;
  --overlay: rgba(20, 22, 28, 0.5);
  color-scheme: light;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
}

}
.inner {

  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra superior */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar .inner { display: flex; align-items: center; gap: 14px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; letter-spacing: -0.02em; margin: 0; margin-right: auto; }
.search { position: relative; flex: 0 1 300px; min-width: 0; }
.search input {
  width: 100%; min-height: 40px; padding: 0 14px; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
}

.btn { min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 0.9rem; }

/* resumo + filtros */
.summary { display: flex; flex-wrap: wrap; gap: 6px 22px; padding-block: 20px 6px; color: var(--muted); font-size: 0.9rem; }

.toolbar { display: flex; align-items: center; gap: 12px; padding-block: 12px 18px; }

.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 0.85rem; font-weight: 600; }

/* grade */
.grid { list-style: none; margin: 0; padding: 0 0 56px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 16px; }
.game { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; min-width: 0; }
.game { cursor: pointer; }
.cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: 0 0 0 1px var(--line); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.game:hover .cover, .game:focus-visible .cover { transform: translateY(-3px); box-shadow: 0 0 0 1px var(--accent), 0 0 26px var(--glow); }
.cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 14px; text-align: center; color: #f1f2f7; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; line-height: 1.25; overflow-wrap: anywhere; }
.badge { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(10, 12, 16, 0.82); font-weight: 700; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.badge.low { color: #aeb3c2; }
.badge.mid { color: #a9b4ff; }
.badge.high { color: #ffd166; }
.tag-ex { position: absolute; right: 8px; top: 8px; padding: 1px 7px; border-radius: 6px; background: rgba(10, 12, 16, 0.7); color: #c9ccd8; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.g-title { margin: 9px 0 0; font-weight: 600; font-size: 0.92rem; line-height: 1.3; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.g-meta { margin: 2px 0 0; color: var(--muted); font-size: 0.78rem; }

.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 56px 16px; border: 1px dashed var(--line); border-radius: 10px; }
.empty strong { display: block; color: var(--fg); font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 6px; }
.empty .btn { margin-top: 16px; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 40px; color: var(--muted); font-size: 0.8rem; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 0.8rem; }

/* abas, status, resumo do ano */
.tabs { display: flex; gap: 22px; padding-top: 14px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 0; min-height: 44px; color: var(--muted); font-weight: 600; font-size: 0.92rem; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tb-status { padding-bottom: 0; }
.tb-status + .toolbar { padding-top: 10px; }
.tag-st { position: absolute; left: 8px; top: 8px; padding: 1px 7px; border-radius: 6px; background: rgba(10, 12, 16, 0.82); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.tag-st.platinado { color: #b9e6ff; }
.tag-st.dropado { color: #ff9e94; }
.tag-st.backlog { color: #c9ccd8; }
.cover.st-dropado img { filter: grayscale(0.8); }
.field textarea { width: 100%; min-width: 0; min-height: 84px; padding: 10px 12px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
.hint { align-self: flex-end; color: var(--muted); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.btn.small { min-height: 34px; padding: 0 14px; font-size: 0.8rem; }
.foot-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.io-status { flex-basis: 100%; min-height: 1.2em; font-size: 0.8rem; color: var(--muted); }
.io-status.error { color: var(--danger); }

.y-head { display: flex; align-items: center; gap: 12px; padding-block: 20px 14px; flex-wrap: wrap; }
.y-head h2 { margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 600; font-size: 1.2rem; }
.y-grid { display: grid; gap: 14px; padding-bottom: 24px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.tile b { display: block; font-family: var(--font-display); font-size: 1.7rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 0.8rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.panel h3 { margin: 0 0 14px; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.y-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.bars { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 6px; height: 180px; }
.bar-col { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.bar-val { height: 18px; font-size: 0.75rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; }
.bar { width: 100%; min-height: 2px; background: var(--accent); border-radius: 4px 4px 0 0; }
.bar.zero { background: var(--line); }
.bar-lbl { height: 22px; padding-top: 5px; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.hrow { display: grid; grid-template-columns: minmax(70px, 120px) minmax(0, 1fr) 28px; gap: 10px; align-items: center; padding-block: 5px; font-size: 0.85rem; }
.hrow > span:first-child { overflow-wrap: anywhere; }
.htrack { height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.hfill { height: 100%; background: var(--accent); border-radius: 5px; }
.hn { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.best { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.best li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.thumb { width: 44px; aspect-ratio: 2 / 3; border-radius: 5px; overflow: hidden; background: var(--surface-2); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.b-title { font-weight: 600; overflow-wrap: anywhere; }
.b-meta { color: var(--muted); font-size: 0.8rem; }
.b-rev { color: var(--muted); font-size: 0.84rem; margin-top: 4px; overflow-wrap: anywhere; }
.b-score { font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
@media (max-width: 600px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .y-two { grid-template-columns: minmax(0, 1fr); }
  .bars { gap: 3px; }
  .bar-lbl { font-size: 0.62rem; letter-spacing: 0; }
}

/* modal */
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--overlay); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal { width: 100%; max-width: 640px; margin: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.modal h2 { margin: 0 0 18px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; }
.m-body { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 22px; }
.cover-pick { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.drop { position: relative; aspect-ratio: 2 / 3; border-radius: 8px; border: 1px dashed var(--muted); background: var(--surface-2); overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px; color: var(--muted); font-size: 0.8rem; cursor: pointer; width: 100%; }
.drop.over { border-color: var(--accent); color: var(--fg); }
.drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pick-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pick-actions .btn { min-height: 34px; padding: 0 12px; font-size: 0.8rem; flex: 1; }
.fields { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
.field input[type="text"], .field input[type="date"], .field select {
  width: 100%; min-width: 0; min-height: 44px; padding: 0 12px; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
}
.rating-row { display: flex; align-items: center; gap: 14px; min-height: 44px; }
.rating-row input { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.rating-value { min-width: 3.2ch; text-align: right; font-weight: 700; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.m-foot { display: flex; align-items: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.m-foot .spacer { flex: 1; }
.status { color: var(--muted); font-size: 0.85rem; min-height: 1.3em; margin-top: 12px; }

@media (max-width: 600px) {
  .m-body { grid-template-columns: 1fr; }
  .cover-pick { max-width: 190px; margin: 0 auto; width: 100%; }
  .search { flex: 1 1 100%; order: 3; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 18px 12px; }
  .toolbar { flex-wrap: wrap; }
  .modal { padding: 18px; }
}
/* vidro e neon discreto */
body { background-color: var(--bg); background-image: radial-gradient(900px 520px at 12% -8%, var(--bg-glow-1), transparent 62%), radial-gradient(760px 480px at 100% 4%, var(--bg-glow-2), transparent 58%); background-repeat: no-repeat; background-attachment: fixed; }
.topbar { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid var(--glass-line); }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 auto 0 0; font-family: var(--font-display); font-weight: 700; font-size: 1.2rem; letter-spacing: 0.26em; text-transform: uppercase; text-shadow: 0 0 18px var(--glow); }

.search input { background: var(--glass); border-color: var(--glass-line); }

.btn { background: var(--glass); border-color: var(--glass-line); }

.copy { letter-spacing: 0.04em; }
/* resumo do jogo */
.overlay.detail { -webkit-backdrop-filter: blur(18px) saturate(120%); backdrop-filter: blur(18px) saturate(120%); }
.sheet { max-width: 560px; }
.sheet-body { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; }
.sheet-cover { position: relative; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: 0 0 0 1px var(--glass-line), 0 0 34px -10px var(--glow); }
.sheet-cover img { display: block; width: 100%; height: 100%; object-fit: cover; }
.sheet-info { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sheet-info h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; line-height: 1.2; overflow-wrap: anywhere; }
.d-tag { align-self: flex-start; padding: 2px 10px; border: 1px solid var(--glass-line); border-radius: 999px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.d-tag.platinado { color: var(--accent); border-color: var(--accent); }
.d-tag.dropado { color: var(--danger); }
.d-tag.backlog { color: var(--muted); }
.d-meta { margin: 0; color: var(--muted); font-size: 0.88rem; }
.d-score { font-family: var(--font-display); font-size: 2rem; font-weight: 700; line-height: 1.1; text-shadow: 0 0 18px var(--glow); font-variant-numeric: tabular-nums; }
.d-score small { font-size: 0.9rem; font-weight: 500; color: var(--muted); text-shadow: none; }
.d-review { margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--glass-line); font-size: 0.95rem; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.d-review.none { color: var(--muted); }
@media (max-width: 600px) {
  .sheet-body { grid-template-columns: minmax(0, 1fr); }
  .sheet-cover { width: 100%; max-width: 170px; margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>

  // ---------- menu de edição, modo de edição e rodapé ----------
  $("year-now").textContent = String(new Date().getFullYear());
  var menuBtn = $("menu-btn"), menu = $("menu");
  function setMenu(open) { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); }
  menuBtn.addEventListener("click", function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener("click", function () { setMenu(false); });
  document.addEventListener("click", function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !menu.hidden) { setMenu(false); menuBtn.focus(); } });
  function setEdit(on) {
    editMode = on;
    document.body.classList.toggle("editing", on);
    $("edit-banner").hidden = !on;
    $("edit-toggle").textContent = on ? "Concluir edição" : "Editar jogos";
    if (on && view !== "lib") setView("lib");
    renderGrid();
  }
  $("edit-toggle").addEventListener("click", function () { setEdit(!editMode); });
  $("edit-done").addEventListener("click", function () { setEdit(false); });

  // ---------- armazenamento ----------
  function normalize(id, d) {
    var st = STATUSES.some(function (s) { return s.id === d.status; }) ? d.status : "zerado";
    var okDate = typeof d.date === "string" && /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(d.date);
    return {
      id: id, title: String(d.title || "").trim().slice(0, 120), platform: String(d.platform || "Outra").slice(0, 60),
      status: st,
      date: st === "backlog" ? (okDate ? d.date : "") : (okDate ? d.date : todayISO()),
      rating: st === "backlog" ? null : Math.min(10, Math.max(0, Number(d.rating) || 0)),
      review: String(d.review || "").slice(0, 280),
      createdAt: Number(d.createdAt) || 0, example: d.example === true,
      cover: typeof d.cover === "string" && d.cover.indexOf("data:image/") === 0 && d.cover.length <= 300000 ? d.cover : ""
    };
  }
  function useLocal() {
    var raw = [];
    try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) {}
    games = (Array.isArray(raw) ? raw : []).map(function (d) { return normalize(d.id, d); });
    function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(games)); } catch (e) {} }
    backend = {
      save: function (id, data) {
        var item = normalize(id, data);
        var i = games.findIndex(function (g) { return g.id === id; });
        if (i >= 0) games[i] = item; else games.push(item);
        persist(); renderAll();
      },
      remove: function (id) { games = games.filter(function (g) { return g.id !== id; }); persist(); renderAll(); }
    };
    ready = true; renderAll();
  }
  function useDb(db) {
    var col = db.collection("games");
    var timer = setTimeout(function () {
      if (!ready) { ready = true; $("storage-note").textContent = "Não foi possível alcançar a lista salva. Tente de novo em instantes."; renderAll(); }
    }, 10000);
    backend = {
      save: function (id, data) { return col.doc(id).set(data); },
      remove: function (id) { return col.doc(id).delete(); }
    };
    col.onSnapshot(function (snap) {
      games = snap.docs.map(function (d) { return normalize(d.id, d.data() || {}); });
      if (!snap.metadata.fromCache) { clearTimeout(timer); $("storage-note").textContent = ""; }
      ready = true; renderAll();
    }, function (e) {
      clearTimeout(timer); ready = true;
      $("storage-note").textContent = e && e.code === "revoked" ? "O acesso mudou. Recarregue a página." : "Erro ao carregar a lista.";
      renderAll();
    });
  }
  function boot() {
    renderAll();
    var c = window.claude;
    if (!c || !c.use) { useLocal(); return; }
    Promise.all([c.use("db"), c.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      if (!db) { useLocal(); return; }
      return Promise.resolve(user ? user.canEdit() : true).then(function (ce) { canWrite = ce !== false; useDb(db); });
    }).catch(function () { useLocal(); });
  }
  boot();
})();
</script>

</body></html>
